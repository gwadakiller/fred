backend:
  name: git-gateway
  branch: main

site_url: https://fred-sandy-phi.vercel.app/

media_folder: "static/img"
public_folder: "/img"

# Configuration pour les documents
media_library:
  name: uploadcare
  config:
    publicKey: "demopublickey"  # On utilisera un upload simple pour l'instant

collections:
  - name: "docs"
    label: "Docs"
    folder: "docs"
    create: true
    slug: "{{slug}}"
        fields:
      - { label: "ID de la page", name: "id", widget: "string", required: false }
      - { label: "Titre de la page", name: "title", widget: "string" }
      - { label: "Nom dans le menu", name: "sidebar_label", widget: "string" }
      - { label: "Position dans le menu", name: "sidebar_position", widget: "number", default: 10 }
      - { label: "Description (optionnel)", name: "description", widget: "string", required: false }
      - { label: "Corps du document", name: "body", widget: "markdown" }

